# @phlix/syncplay — CI
#
# Deterministic gate: lint, typecheck, build (ES+CJS + d.ts), and run the full
# vitest suite with coverage. Runs on every push to master and on pull requests,
# plus manual dispatch. Verified green by a manual dispatch on 2026-07-26 before
# the push/pull_request triggers were enabled.
name: syncplay-ci

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:run -- --coverage

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1
        # Never allowed to fail the build: a missing/expired token or a Codacy
        # outage must not turn CI red.
        # NOTE: continue-on-error makes a FAILED step report "success" — to check
        # whether an upload actually happened, read the step log for
        # "Coverage data uploaded", not the step conclusion.
        continue-on-error: true
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: ./coverage/lcov.info
