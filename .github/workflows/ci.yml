# @phlix/syncplay — CI
#
# Deterministic gate: lint, typecheck, build (ES+CJS + d.ts), and run the full
# vitest suite with coverage. Runs on every push to master and on pull requests,
# plus manual dispatch. Verified green by a manual dispatch on 2026-07-26 before
# the push/pull_request triggers were enabled.
name: syncplay-ci

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:run
